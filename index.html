<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090713" />
    <link rel="preload" href="/assets/thesportzine-header.png" as="image" fetchpriority="high" />
    <link rel="icon" type="image/png" href="/assets/thesportzine-shield.png" />
    <link rel="ard" type="application/ard+json" href="/.well-known/ard.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" /></noscript>
    <title>FPL by The Sportzine</title>
    <meta name="description" content="Your FPL team, live points and player analytics." />
    <link rel="canonical" href="https://fpl.thesportzine.com/" />
    <meta property="og:url" content="https://fpl.thesportzine.com/" />
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function(){window.dataLayer.push(arguments);};
      window.gtag("js", new Date());
      window.gtag("config", "G-7S4YVGSWV6");
      (function () {
        var analyticsLoaded = false, adsLoaded = false;
        function loadScript(src, attrs) {
          var script = document.createElement("script");
          script.src = src;
          script.async = true;
          if (attrs) Object.keys(attrs).forEach(function(key){script.setAttribute(key, attrs[key]);});
          document.head.appendChild(script);
        }
        function loadAnalytics() {
          if (analyticsLoaded) return;
          analyticsLoaded = true;
          loadScript("https://www.googletagmanager.com/gtag/js?id=G-7S4YVGSWV6");
        }
        function loadAds() {
          if (adsLoaded) return;
          adsLoaded = true;
          loadScript("https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5258499980991150", {crossorigin:"anonymous"});
        }
        function idle(callback, timeout) {
          if ("requestIdleCallback" in window) window.requestIdleCallback(callback, {timeout:timeout});
          else window.setTimeout(callback, timeout);
        }
        window.addEventListener("load", function(){
          idle(loadAnalytics, 1800);
          idle(loadAds, 3000);
        }, {once:true});
        ["pointerdown","touchstart","keydown","scroll"].forEach(function(eventName){
          window.addEventListener(eventName, function(){
            idle(loadAnalytics, 500);
            idle(loadAds, 1200);
          }, {once:true,passive:true});
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <style>
      /* Mobile banner ads: fluid width with a strict 16:5 aspect ratio. */
      @media (max-width: 700px) {
        .tsz-mobile-banner {
          display: block !important;
          box-sizing: border-box !important;
          width: 100% !important;
          max-width: 100% !important;
          height: auto !important;
          aspect-ratio: 16 / 5 !important;
          min-height: 0 !important;
          max-height: none !important;
          margin: 8px auto 14px !important;
          padding: 0 !important;
          overflow: hidden !important;
        }
        .tsz-mobile-banner ins.adsbygoogle {
          display: block !important;
          box-sizing: border-box !important;
          width: 100% !important;
          max-width: 100% !important;
          height: 100% !important;
          min-height: 0 !important;
          max-height: none !important;
          margin: 0 auto !important;
          overflow: hidden !important;
        }
        .tsz-mobile-banner ins.adsbygoogle iframe {
          display: block !important;
          width: 100% !important;
          max-width: 100% !important;
          max-height: none !important;
        }
      }
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
